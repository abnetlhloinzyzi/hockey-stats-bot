name: Weekly Hockey Newsletter

on:
  schedule:
    # Runs every Monday at 13:00 UTC (8:00 AM EST)
    - cron: '0 13 * * 1'
  workflow_dispatch: # Allows manual trigger from GitHub anytime

jobs:
  run-bot:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      actions: write
    steps:
      - name: Checkout repo
        uses: actions/checkout@v5  # Updated from v4

      - name: Set up Python
        uses: actions/setup-python@v6  # Updated from v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          pip install -r requirements.txt
          playwright install chromium --with-deps

      - name: Run Hockey Bot
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          SENDER_EMAIL: ${{ secrets.SENDER_EMAIL }}
          SENDER_PASSWORD: ${{ secrets.SENDER_PASSWORD }}
          RECIPIENT_EMAILS: ${{ secrets.RECIPIENT_EMAILS }}
        run: python bot.py